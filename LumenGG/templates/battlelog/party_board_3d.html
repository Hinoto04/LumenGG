{% load static %}
<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><title>루멘 파티 3D 보드</title>
<link rel="stylesheet" href="{% static 'v2/lumen-party-game.css' %}?v=20261019-supplies1">
<link rel="icon" href="{% static 'favicon.ico' %}" type="image/x-icon">
<style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#97b9d3;font-family:system-ui,sans-serif}#party-board{position:absolute;inset:0;touch-action:none;overflow:hidden}button{font-family:inherit}</style>
</head><body><div id="party-board" aria-label="루멘 파티 3D 지도"></div>
<script type="module">
import {createPartyScene} from "{% static 'v2/lumen-party-scene.js' %}?v=20261019-supplies1";
const send = message => window.ReactNativeWebView?.postMessage(JSON.stringify(message));
try {
  const scene=createPartyScene(document.getElementById('party-board'),{
    getInsets:()=>({left:110,right:8,top:50,bottom:30}),
    onTileSelect:id=>send({type:'tile',id}),onDirectionSelect:id=>send({type:'direction',id}),onMovementComplete:version=>send({type:'settled',version}),onFailure:()=>send({type:'fallback'}),
  });
  window.updatePartyBoard=(state,selected,legal)=>scene.update(state,selected,legal);
  window.partyBoardActive=active=>scene.pause(!active);
  window.partyBoardFocus=seat=>scene.focusPlayer(seat);
  window.partyBoardCamera=(action)=>{
    if(action==='in'||action==='out')scene.zoom(action==='in'?1.15:1/1.15);
    if(action==='reset')scene.reset();
  };
  window.addEventListener('pagehide',()=>scene.dispose());
  send({type:'ready'});
}catch(error){send({type:'fallback'});}
</script></body></html>
