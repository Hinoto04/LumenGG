services:
  nginx:
    image: nginx:stable
    ports: ["80:80"]
    volumes:
      - ./nginx:/etc/nginx/conf.d:ro
      - ./staticfiles:/staticfiles:ro
    depends_on: [server, realtime]
  server: &application
    build: .
    command: gunicorn LumenGG.wsgi:application --bind 0.0.0.0:8000
    restart: unless-stopped
    environment:
      LUMENGG_REDIS_URL: redis://redis:6379/0
      LUMENGG_BATTLELOG_REDIS_URL: redis://redis:6379/1
      LUMENGG_MOBILE_CATALOG_ROOT: /app/mobile_catalog
    volumes:
      - ./SECRET_KEYS.py:/app/SECRET_KEYS.py:ro
      - ./staticfiles:/app/staticfiles
      - ./media:/home/ubuntu/images/lumendb
      - mobile-catalog:/app/mobile_catalog
    depends_on:
      redis:
        condition: service_healthy
  realtime:
    <<: *application
    command: daphne -b 0.0.0.0 -p 8000 LumenGG.asgi:application
  catalog-publisher:
    <<: *application
    command: python manage.py publish_mobile_catalog --watch
  event-flusher:
    <<: *application
    command: python manage.py flush_battle_events --watch
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes: [redis-data:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  mobile-catalog:
  redis-data:
